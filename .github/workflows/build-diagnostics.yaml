# Two unrelated diagnostics sharing one file: conflict_diagnosis reconstructs a build
# that never ran; release_failure_diagnosis explains one that already ran and failed.
# Neither job ever opens an issue -- the workflow that hits the problem does that.
name: Build diagnostics

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to diagnose a merge conflict for'
        required: false
      failure_issue_number:
        description: 'Issue number to diagnose a build failure for'
        required: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  conflict_diagnosis:
    name: Speculative merge + compile
    # Attaching a label at issue creation needs write access; a random issue-opener can't reach this.
    if: (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'upstream-merge-conflict')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Resolve issue number
        id: issue
        working-directory: .
        run: |
          set -euo pipefail
          NUM="${{ github.event.inputs.issue_number }}"
          NUM="${NUM:-${{ github.event.issue.number }}}"
          if ! [[ "$NUM" =~ ^[0-9]+$ ]]; then
            echo "Issue number '$NUM' is not a plain integer -- refusing to proceed." >&2
            exit 1
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      # Marker is an HTML comment upstream-drift.yaml writes -- parsing that beats
      # regexing the human-readable prose, which would break on a reword.
      - name: Extract refs from the issue body
        id: refs
        working-directory: .
        run: |
          set -euo pipefail
          BODY=$(gh issue view "${{ steps.issue.outputs.number }}" --repo "${{ github.repository }}" --json body -q .body)
          MARKER=$(echo "$BODY" | grep -o '<!-- upstream-merge-conflict:[^>]*-->' | head -1 || true)
          if [ -z "$MARKER" ]; then
            echo "No machine-readable marker in issue #${{ steps.issue.outputs.number }} -- was it opened by upstream-drift.yaml?" >&2
            exit 1
          fi
          OURS=$(echo "$MARKER" | grep -oE 'ours=[0-9a-f]+' | cut -d= -f2)
          UPSTREAM=$(echo "$MARKER" | grep -oE 'upstream=[0-9a-f]+' | cut -d= -f2)
          if [ -z "$OURS" ] || [ -z "$UPSTREAM" ]; then
            echo "Marker found but missing ours=/upstream= SHAs: $MARKER" >&2
            exit 1
          fi
          echo "ours=$OURS" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"

      - name: Checkout our side at the reported SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.ours }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"

      # smollm declares externalNativeBuild, so AGP needs the NDK resolvable at
      # config time even though this diagnostic never runs the native build.
      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: android-ndk-27.2.12479018

      - name: Install Android NDK 27.2.12479018
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"

      - name: Configure git identity for the bot
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        working-directory: .
        run: |
          git remote add upstream https://github.com/google-ai-edge/gallery.git
          git fetch upstream

      - name: Speculative merge favoring our side
        id: merge
        working-directory: .
        run: |
          set -euo pipefail
          if git merge --no-edit -X ours "${{ steps.refs.outputs.upstream }}"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            # -X ours auto-resolves interleaved-text conflicts; a real failure here
            # means a rename/delete conflict -- report it, don't guess further.
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile (diagnostic only -- never packaged or signed)
        id: build
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          if ./gradlew :app:compileReleaseKotlin --no-daemon > /tmp/build.log 2>&1; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Report result to the issue
        working-directory: .
        run: |
          set -euo pipefail
          NUM="${{ steps.issue.outputs.number }}"
          {
            if [ "${{ steps.merge.outputs.merged }}" != "true" ]; then
              echo "### Build diagnostic: inconclusive"
              echo
              echo "Speculatively merging upstream with \`-X ours\` still left a real conflict --"
              echo "not just interleaved text, likely a rename or delete. This diagnostic can't"
              echo "proceed automatically; a human needs to look directly."
            elif [ "${{ steps.build.outputs.passed }}" = "true" ]; then
              echo "### Build diagnostic: no cascading break found"
              echo
              echo "Resolved the reported conflict favoring our side (\`git merge -X ours\`, a"
              echo "throwaway resolution, never committed) and \`:app:compileReleaseKotlin\`"
              echo "passed. No file outside the conflict itself appears broken by this drift."
            else
              echo "### Build diagnostic: cascading break found"
              echo
              echo "Resolved the reported conflict favoring our side (\`git merge -X ours\`, a"
              echo "throwaway resolution, never committed), then \`:app:compileReleaseKotlin\`"
              echo "failed -- meaning a file that merged **without** a conflict marker still"
              echo "broke, because it referenced something the other side changed independently."
              echo "This is the class of break a plain diff can't show."
              echo
              echo '```'
              grep -E '^e: ' /tmp/build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' || echo "(compiler output unavailable)"
              echo '```'
            fi
            echo
            echo "_Throwaway diagnostic: nothing here was committed or pushed. \`-X ours\` is a_"
            echo "_blunt pick and may not match the resolution a human actually wants -- it exists_"
            echo "_only to surface build breaks a plain diff can't._"
          } > /tmp/diagnostic_comment.md
          gh issue comment "$NUM" --repo "${{ github.repository }}" --body-file /tmp/diagnostic_comment.md

  release_failure_diagnosis:
    name: Explain a real Release APK failure
    # Attaching a label at issue creation needs write access; a random issue-opener can't reach this.
    if: (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ci-build-failure')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.failure_issue_number != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Resolve issue number
        id: issue
        run: |
          set -euo pipefail
          NUM="${{ github.event.inputs.failure_issue_number }}"
          NUM="${NUM:-${{ github.event.issue.number }}}"
          if ! [[ "$NUM" =~ ^[0-9]+$ ]]; then
            echo "Issue number '$NUM' is not a plain integer -- refusing to proceed." >&2
            exit 1
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      # Marker is an HTML comment release.yaml writes on its own failure.
      - name: Extract run id and SHA from the issue body
        id: refs
        run: |
          set -euo pipefail
          BODY=$(gh issue view "${{ steps.issue.outputs.number }}" --repo "${{ github.repository }}" --json body -q .body)
          MARKER=$(echo "$BODY" | grep -o '<!-- ci-build-failure:[^>]*-->' | head -1 || true)
          if [ -z "$MARKER" ]; then
            echo "No machine-readable marker in issue #${{ steps.issue.outputs.number }} -- was it opened by release.yaml?" >&2
            exit 1
          fi
          RUN_ID=$(echo "$MARKER" | grep -oE 'run_id=[0-9]+' | cut -d= -f2)
          SHA=$(echo "$MARKER" | grep -oE 'sha=[0-9a-f]+' | cut -d= -f2)
          if [ -z "$RUN_ID" ] || [ -z "$SHA" ]; then
            echo "Marker found but missing run_id=/sha= values: $MARKER" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Find the last successful Release APK run before this one
        id: baseline
        run: |
          set -euo pipefail
          CREATED_AT=$(gh run view "${{ steps.refs.outputs.run_id }}" --repo "${{ github.repository }}" --json createdAt -q .createdAt)
          BASELINE_SHA=$(gh run list --repo "${{ github.repository }}" --workflow "Release APK" \
            --status success --branch main --limit 30 \
            --json headSha,createdAt \
            --jq "[.[] | select(.createdAt < \"$CREATED_AT\")] | sort_by(.createdAt) | last | .headSha // empty")
          echo "sha=$BASELINE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout at the failing SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.sha }}
          fetch-depth: 0

      - name: Extract the real failure output
        id: log
        working-directory: .
        run: |
          set -euo pipefail
          gh run view "${{ steps.refs.outputs.run_id }}" --repo "${{ github.repository }}" --log-failed > /tmp/full_log.txt
          tail -n 150 /tmp/full_log.txt > /tmp/log_excerpt.txt
          # Strip the runner's checkout-root prefix only (segment-bounded), not a greedy
          # match to the last "gallery/" -- the package path also contains that name.
          grep -oE 'file:///home/runner/work/[^/]+/[^/]+/\S+\.kt' /tmp/full_log.txt \
            | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##; s#:[0-9]+:[0-9]+$##' \
            | sort -u > /tmp/implicated_files.txt || true

      - name: Diff implicated files against the last known-good commit
        id: trace
        working-directory: .
        run: |
          set -euo pipefail
          BASELINE="${{ steps.baseline.outputs.sha }}"
          : > /tmp/failure_trace.md
          if [ -z "$BASELINE" ]; then
            echo "_No prior successful \`Release APK\` run found in the last 30 runs -- skipping the diff._" > /tmp/failure_trace.md
          elif [ -s /tmp/implicated_files.txt ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # `|| true`: pipefail otherwise turns head's SIGPIPE on a long diff into a step failure.
              FILE_DIFF=$(git diff "$BASELINE" "${{ steps.refs.outputs.sha }}" -- "$f" | head -n 200 || true)
              {
                echo "<details>"
                echo "<summary><code>$f</code></summary>"
                echo
                if [ -z "$FILE_DIFF" ]; then
                  echo "_Unchanged since baseline -- the break likely comes from a file this one_"
                  echo "_depends on, not from an edit to this file itself._"
                else
                  echo '```diff'
                  echo "$FILE_DIFF"
                  echo '```'
                fi
                echo
                echo "</details>"
                echo
              } >> /tmp/failure_trace.md
            done < /tmp/implicated_files.txt
          else
            {
              echo "No file could be identified directly from the failure log; overall diffstat"
              echo "since the last known-good commit (\`$BASELINE\`):"
              echo '```'
              git diff --stat "$BASELINE" "${{ steps.refs.outputs.sha }}" | tail -n 40
              echo '```'
            } >> /tmp/failure_trace.md
          fi

      - name: Post diagnostic comment on the issue
        working-directory: .
        run: |
          set -euo pipefail
          NUM="${{ steps.issue.outputs.number }}"
          {
            if [ -n "${{ steps.baseline.outputs.sha }}" ]; then
              echo "Last known-good: \`${{ steps.baseline.outputs.sha }}\`"
              echo
            fi
            echo "### Failure output (tail)"
            echo '```'
            cat /tmp/log_excerpt.txt
            echo '```'
            echo
            echo "### What changed since the last known-good build"
            echo
            cat /tmp/failure_trace.md
          } > /tmp/diagnostic_comment.md
          gh issue comment "$NUM" --repo "${{ github.repository }}" --body-file /tmp/diagnostic_comment.md
