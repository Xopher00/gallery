# PR verification build, debug-signed artifact. Pushes to main are built,
# signed and released by sync-and-release.yaml instead.
name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - 'Android/**'
      - '.github/workflows/ci-build.yaml'
      - '.github/actions/**'

jobs:
  build_apk:
    name: Build Android APK (with submodules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout the source code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/android-build-env
        with:
          cache-prefix: ccache

      # abiFilters in the module build files already restrict this to arm64-v8a.
      - name: Build
        run: ./gradlew assembleRelease --no-daemon -PuseCcache

      - name: Check APK contents
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk)
          if ! unzip -l "$APK" | grep -q 'META-INF/services/kotlinx.coroutines.internal.MainDispatcherFactory'; then
            echo "APK has no MainDispatcherFactory service file (R8 stripped it); the app crashes at launch"
            exit 1
          fi
          echo "lib/arm64-v8a entries: $(unzip -l "$APK" | grep -c 'lib/arm64-v8a/')"

      - name: Show ccache stats
        run: ccache -s

      # keystore.properties is gitignored and absent in CI, so the build falls
      # back to debug signing on its own; no secrets needed here.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-fork-release-apk
          path: Android/src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
