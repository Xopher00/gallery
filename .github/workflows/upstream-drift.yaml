# Reports drift to one reusable issue, then (only if anything's new) attempts a real
# merge: clean+builds -> pushed straight to main; clean but build fails -> draft PR;
# an actual conflict -> one reusable issue, never a branch or PR.
name: Upstream drift and merge

on:
  schedule:
    # Daily, off the hour; upstream averages ~58 commits/month so weekly risks a pile-up.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref to merge (as fetched under the upstream remote)'
        required: false
        default: 'upstream/main'

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DRIFT_LABEL: upstream-drift
  MERGE_CONFLICT_LABEL: upstream-merge-conflict

jobs:
  check_drift:
    name: Check upstream drift
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    outputs:
      ahead_count: ${{ steps.drift.outputs.ahead_count }}
    steps:
      - name: Checkout main (no submodules needed for a text/log diff)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity for the bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/google-ai-edge/gallery.git
          git fetch upstream main

      - name: Compute drift facts
        id: drift
        run: |
          set -euo pipefail

          MERGE_BASE=$(git merge-base main upstream/main)
          OUR_SHA=$(git rev-parse main)
          UPSTREAM_SHA=$(git rev-parse upstream/main)

          AHEAD_COUNT=$(git rev-list --count main..upstream/main)
          UPSTREAM_DATE=$(git log -1 --format=%cI upstream/main)

          # Conflict preview: merge-tree does not touch the working tree or
          # require a real merge/checkout.
          MERGE_TREE_OUT=$(git merge-tree --write-tree --messages main upstream/main || true)
          CONFLICT_FILES=$(echo "$MERGE_TREE_OUT" | grep '^CONFLICT' || true)
          CONFLICT_COUNT=$(echo "$CONFLICT_FILES" | grep -c '^CONFLICT' || true)

          # Computed, not hand-maintained -- a name list goes stale the moment a new
          # file crosses the risk line. 5 is the natural gap in this fork's own hunk
          # counts: {1,1,3} below it, {6,7,7,9,9,17} above.
          WATCHLIST_HUNK_THRESHOLD=5
          CHANGED_SINCE_BASE=$(git diff --name-only "$MERGE_BASE" upstream/main)

          WATCHLIST_HITS=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git cat-file -e "upstream/main:$f" 2>/dev/null || continue
            HUNKS=$(git diff "$MERGE_BASE" main -- "$f" | grep -c '^@@' || true)
            if [ "$HUNKS" -ge "$WATCHLIST_HUNK_THRESHOLD" ]; then
              WATCHLIST_HITS="${WATCHLIST_HITS}${f} (${HUNKS} fork hunks)
          "
            fi
          done <<< "$CHANGED_SINCE_BASE"

          {
            echo "merge_base=$MERGE_BASE"
            echo "our_sha=$OUR_SHA"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "ahead_count=$AHEAD_COUNT"
            echo "upstream_date=$UPSTREAM_DATE"
            echo "conflict_count=$CONFLICT_COUNT"
          } >> "$GITHUB_OUTPUT"

          # Multi-line values go to files; body assembly step reads them back.
          echo "$CONFLICT_FILES" > /tmp/conflict_files.txt
          echo "$WATCHLIST_HITS" > /tmp/watchlist_hits.txt

      - name: Assemble issue body
        id: body
        run: |
          set -euo pipefail
          RUN_TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          {
            echo "## Upstream drift report"
            echo
            echo "- Run: $RUN_TS (workflow run ${{ github.run_id }})"
            echo "- Our \`main\`: \`${{ steps.drift.outputs.our_sha }}\`"
            echo "- \`upstream/main\`: \`${{ steps.drift.outputs.upstream_sha }}\` (newest commit: ${{ steps.drift.outputs.upstream_date }})"
            echo "- Merge base: \`${{ steps.drift.outputs.merge_base }}\`"
            echo "- Upstream is **${{ steps.drift.outputs.ahead_count }} commits** ahead of us"
            echo
            echo "### Merge-tree conflict preview"
            echo "Conflict count: **${{ steps.drift.outputs.conflict_count }}**"
            echo
            if [ -s /tmp/conflict_files.txt ]; then
              echo '```'
              cat /tmp/conflict_files.txt
              echo '```'
            else
              echo "_None reported by \`git merge-tree\`._"
            fi
            echo
            echo "### Watchlist files changed upstream since merge base"
            echo
            echo "Computed each run (files with 5+ fork hunks that upstream also touched)."
            echo "A clean merge-tree is not proof of a working merge for one of these."
            echo
            if [ -s /tmp/watchlist_hits.txt ]; then
              echo '```'
              cat /tmp/watchlist_hits.txt
              echo '```'
            else
              echo "_No watchlist file changed upstream since the merge base._"
            fi
          } > /tmp/issue_body.md

          cat /tmp/issue_body.md

      # The label does not exist in the repo yet, and `gh issue create
      # --label <nonexistent>` errors out — so the very first run would fail
      # without this. `--force` makes re-runs a no-op update once it exists.
      - name: Ensure the drift label exists
        run: |
          set -euo pipefail
          gh label create "$DRIFT_LABEL" \
            --repo "${{ github.repository }}" \
            --description "Automated upstream drift tracker" \
            --color 0E8A16 \
            --force

      - name: Find or create the reusable drift issue
        id: issue
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "$DRIFT_LABEL" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "number=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Create issue (first run only)
        if: steps.issue.outputs.number == ''
        run: |
          set -euo pipefail
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Upstream drift tracker (google-ai-edge/gallery)" \
            --label "$DRIFT_LABEL" \
            --body-file /tmp/issue_body.md

      - name: Update existing issue in place
        if: steps.issue.outputs.number != ''
        run: |
          set -euo pipefail
          NUM="${{ steps.issue.outputs.number }}"
          gh issue edit "$NUM" --repo "${{ github.repository }}" --body-file /tmp/issue_body.md
          gh issue comment "$NUM" --repo "${{ github.repository }}" \
            --body "Drift check run $(date -u +"%Y-%m-%dT%H:%M:%SZ"): ${{ steps.drift.outputs.ahead_count }} commits behind, ${{ steps.drift.outputs.conflict_count }} conflicting files. See updated issue body above."

  merge:
    name: Attempt merge
    needs: check_drift
    if: needs.check_drift.outputs.ahead_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    defaults:
      run:
        working-directory: ./Android/src
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main (with submodules, for a real build attempt)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Configure git identity for the bot
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        working-directory: .
        run: |
          git remote add upstream https://github.com/google-ai-edge/gallery.git
          git fetch upstream

      - name: Create sync branch
        id: branch
        working-directory: .
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="sync/upstream-${SHORT_SHA}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Attempt merge (do not fail the job on conflicts)
        id: merge
        working-directory: .
        run: |
          set -euo pipefail
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref }}"
          UPSTREAM_REF="${UPSTREAM_REF:-upstream/main}"

          if git merge --no-edit "$UPSTREAM_REF"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            NEW_COMMITS=$(git rev-list --count main..HEAD)
            if [ "$NEW_COMMITS" -eq 0 ]; then
              echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
            else
              echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Abort so no partial/unresolved merge is ever pushed.
            git diff --name-only --diff-filter=U > /tmp/conflict_files.txt || true
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save conflict list
        if: steps.merge.outputs.clean == 'false'
        run: cp /tmp/conflict_files.txt /tmp/conflict_files_saved.txt || touch /tmp/conflict_files_saved.txt

      # arm64-v8a is enforced by abiFilters in the build files already.
      - name: Build (only if merge was clean and non-empty)
        id: build
        if: steps.merge.outputs.clean == 'true' && steps.merge.outputs.has_new_commits == 'true'
        run: |
          set -euo pipefail
          if ./gradlew assembleRelease --no-daemon; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Auto-merge into main (clean and builds)
        if: steps.merge.outputs.clean == 'true' && steps.merge.outputs.has_new_commits == 'true' && steps.build.outputs.passed == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Report auto-merge to job summary
        if: steps.merge.outputs.clean == 'true' && steps.merge.outputs.has_new_commits == 'true' && steps.build.outputs.passed == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          {
            echo "## Assisted upstream merge — merged automatically"
            echo
            echo "Merged ref: \`${{ github.event.inputs.upstream_ref || 'upstream/main' }}\`"
            echo "New \`main\`: \`$(git rev-parse HEAD)\`"
            echo
            echo "Clean merge, \`assembleRelease\` passed — pushed directly, no PR needed."
          } >> "$GITHUB_STEP_SUMMARY"

      # Clean merge, build failed: needs a human with the real merged tree.
      - name: Push sync branch (build failed)
        if: steps.merge.outputs.clean == 'true' && steps.merge.outputs.has_new_commits == 'true' && steps.build.outputs.passed == 'false'
        working-directory: .
        run: |
          set -euo pipefail
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Assemble PR body
        if: steps.merge.outputs.clean == 'true' && steps.merge.outputs.has_new_commits == 'true' && steps.build.outputs.passed == 'false'
        working-directory: .
        run: |
          set -euo pipefail
          {
            echo "## Assisted upstream merge — build failed"
            echo
            echo "Merged ref: \`${{ github.event.inputs.upstream_ref || 'upstream/main' }}\`"
            echo
            echo "Merge was textually clean, but \`assembleRelease\` **FAILED** — see the"
            echo "workflow run logs. A clean merge is not proof of a working one."
            echo
            echo "---"
            echo "Opened as a **draft** by an automated workflow. Never auto-merged — a"
            echo "human must fix the build before merging."
          } > /tmp/pr_body.md

      - name: Open draft PR (build failed)
        if: steps.merge.outputs.clean == 'true' && steps.merge.outputs.has_new_commits == 'true' && steps.build.outputs.passed == 'false'
        working-directory: .
        run: |
          set -euo pipefail
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --draft \
            --title "Assisted upstream merge (build failed): ${{ steps.branch.outputs.branch }}" \
            --body-file /tmp/pr_body.md

      # Conflict path: no branch, no PR -- one reusable issue instead.
      - name: Ensure the merge-conflict label exists
        if: steps.merge.outputs.clean == 'false'
        working-directory: .
        run: |
          set -euo pipefail
          gh label create "$MERGE_CONFLICT_LABEL" \
            --repo "${{ github.repository }}" \
            --description "Automated upstream merge hit a real conflict" \
            --color D93F0B \
            --force

      - name: Assemble conflict issue body
        if: steps.merge.outputs.clean == 'false'
        working-directory: .
        run: |
          set -euo pipefail
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref || 'upstream/main' }}"
          {
            echo "## Assisted upstream merge — CONFLICTS"
            echo
            echo "Merged ref: \`$UPSTREAM_REF\`"
            echo
            echo "- Our \`main\`: \`$(git rev-parse main)\`"
            echo "- Upstream (\`$UPSTREAM_REF\`): \`$(git rev-parse "$UPSTREAM_REF")\`"
            echo
            echo "Merge was attempted and **aborted** — the working tree was left clean."
            echo "No branch was pushed and no PR was opened."
            echo
            echo "### Conflicting files"
            echo '```'
            cat /tmp/conflict_files_saved.txt 2>/dev/null || echo "(list unavailable)"
            echo '```'
            echo
            echo "A human must resolve this conflict manually — this workflow does not"
            echo "attempt conflict resolution."
          } > /tmp/conflict_issue_body.md

      - name: Find or create the reusable conflict issue
        if: steps.merge.outputs.clean == 'false'
        id: conflict_issue
        working-directory: .
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "$MERGE_CONFLICT_LABEL" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "number=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Create conflict issue (first occurrence)
        if: steps.merge.outputs.clean == 'false' && steps.conflict_issue.outputs.number == ''
        working-directory: .
        run: |
          set -euo pipefail
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Upstream merge conflict (google-ai-edge/gallery)" \
            --label "$MERGE_CONFLICT_LABEL" \
            --body-file /tmp/conflict_issue_body.md

      - name: Update conflict issue in place
        if: steps.merge.outputs.clean == 'false' && steps.conflict_issue.outputs.number != ''
        working-directory: .
        run: |
          set -euo pipefail
          NUM="${{ steps.conflict_issue.outputs.number }}"
          gh issue edit "$NUM" --repo "${{ github.repository }}" --body-file /tmp/conflict_issue_body.md
          gh issue comment "$NUM" --repo "${{ github.repository }}" \
            --body "Merge attempted again $(date -u +"%Y-%m-%dT%H:%M:%SZ"), still conflicting. See updated issue body above."
