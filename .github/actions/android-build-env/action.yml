# Composite steps run at the repo root; they do not inherit the caller's working-directory.
name: Android build environment
description: Java, Android SDK, pinned NDK, Gradle and ccache setup with caching.
inputs:
  cache-prefix:
    description: ccache cache-key prefix, separating the PR pool from the main pool
    required: false
    default: ccache
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # apt, not a third-party Action, per this repo's supply-chain rule.
    - name: Install ccache
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ccache

    # NDK cross-compiles embed per-run timestamps/paths that don't affect output;
    # ccache's default strict mode would miss on every run without these.
    - name: Configure ccache
      shell: bash
      run: |
        {
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache"
          echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,file_macro"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=2G"
        } >> "$GITHUB_ENV"

    # The native submodules' pinned SHAs decide ccache validity; hashFiles() can
    # only read workspace files, so capture them into one.
    - name: Record submodule SHAs for cache key
      shell: bash
      run: git submodule status > ci-submodule-shas.txt

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Install Android SDK Platform 37
      shell: bash
      run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

    # Version pinned identically in smollm/, stablediffusion/ and whisper/ build.gradle.kts.
    - name: Cache Android NDK
      id: ndk-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        key: android-ndk-27.2.12479018

    - name: Install Android NDK 27.2.12479018
      if: steps.ndk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

    # restore-keys let a warm-but-not-exact cache seed the build, and the pools fall back to each other.
    - name: Cache ccache directory
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ hashFiles('ci-submodule-shas.txt') }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-${{ runner.os }}-
          ccache-${{ runner.os }}-
